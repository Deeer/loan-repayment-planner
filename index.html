<header class="top"><div><div class="eyebrow">LOAN REPAYMENT PLANNER</div><h1>提前还款，算清每一步</h1><div class="sub">对比商贷与公积金贷款的余额曲线、利息变化和结清时间</div><div class="sub" style="font-size:11px;margin-top:5px">演示数据为虚构示例；输入在浏览器本地计算，不会上传。</div></div><div class="actions"><button class="btn" id="reset">恢复示例</button><button class="btn primary" id="export">导出还款明细 CSV</button></div></header>

function calc(loan,extras=[],modeOverride=null){let p=loan.principal,r=loan.annual/12,n=Math.max(1,Math.round(loan.months)),mode=modeOverride||loan.mode,basePay=loan.payment??(mode==='annuity'?paymentFor(p,r,n):p/n+p*r),schedule=[],totalInterest=0;let byPeriod={};for(const e of extras)if(e.loan===loan.id){byPeriod[e.period]=byPeriod[e.period]||[];byPeriod[e.period].push(e)}for(let i=1;i<=1200;i++){if(p<=.005)break;let interest=p*r,normal=mode==='equalPrincipal'?Math.min(p+interest,p/n+interest):Math.min(p+interest,basePay),prin=Math.max(0,normal-interest),actions=byPeriod[i]||[],extra=Math.min(p-prin,actions.reduce((s,e)=>s+Math.max(0,e.amount),0));p=Math.max(0,p-prin-extra);totalInterest+=interest;schedule.push({period:i,date:addMonths(new Date(loan.start+'T00:00:00'),i-1),payment:normal,interest,principal:prin,extra,balance:p,share:normal?interest/normal:0,totalInterest});if(extra>0&&p>0&&actions.some(e=>e.adjust==='lowerPayment'))basePay=mode==='annuity'?paymentFor(p,r,Math.max(1,n-i)):p/Math.max(1,n-i)+p*r}return{schedule,totalInterest,payoff:schedule.length,paid:schedule.reduce((s,x)=>s+x.payment+x.extra,0),initial:loan.principal}}

function activeIds(){return state.loans.filter(l=>active[l.id]&&l.principal>0).map(l=>l.id)}
function update(){results={};let ids=activeIds();ids.forEach(id=>{let l=state.loans.find(x=>x.id===id);if(!Number.isFinite(l.principal)||l.principal<=0||!Number.isFinite(l.annual)||l.annual<0||!Number.isFinite(l.months)||l.months<1||!l.start){return}results[id]=calc(l,state.early)});ids=ids.filter(id=>results[id]);if(!ids.length){document.querySelector('#stats').innerHTML='<div class="card stat"><div class="label">等待有效输入</div><div class="hint">请确认贷款已启用，且本金、利率、期数和日期均有效</div></div>';document.querySelector('#loanDetails').innerHTML='';['balanceChart','interestChart','comparison','scheduleTable'].forEach(id=>document.querySelector('#'+id).innerHTML='');return}if(!ids.includes(tableKind))tableKind=ids[0];if(shareKind!=='both'&&!ids.includes(shareKind))shareKind=ids.length>1?'both':ids[0];let total=ids.reduce((s,id)=>s+results[id].totalInterest,0),months=Math.max(...ids.map(id=>results[id].payoff)),monthly=ids.reduce((s,id)=>{let l=state.loans.find(x=>x.id===id);return s+(l.payment??(l.mode==='annuity'?paymentFor(l.principal,l.annual/12,l.months):l.principal/l.months+l.principal*l.annual/12))},0),last=ids.map(id=>results[id].schedule.at(-1)).sort((a,b)=>b.date-a.date)[0];document.querySelector('#stats').innerHTML=[['预计总利息',yuan(total),'已计入提前还款方案'],['合计月供',yuan(monthly),'提前还款前的正常月供'],['全部贷款结清',`${Math.floor(months/12)} 年 ${months%12} 个月`,last?'约 '+dateFmt(last.date):'—'],['还款利息节省',yuan(calcBaseInterest()-total),'与无提前还款方案相比']].map(x=>`<div class="card stat"><div class="label">${x[0]}</div><div class="num">${x[1]}</div><div class="hint">${x[2]}</div></div>`).join('');chartBalance();chartInterest();attachChartHover('balanceChart','balanceTip','balance');attachChartHover('interestChart','interestTip','interest');renderLoanDetails(ids);renderTabs(ids);document.querySelector('#compareCard').style.display=ids.length>1?'':'none';compare();renderTable()}
function renderLoanDetails(ids){document.querySelector('#loanDetails').innerHTML=ids.map(id=>{let l=state.loans.find(x=>x.id===id),r=results[id],last=r.schedule.at(-1);return `<div class="detail-box"><h3>${l.name}</h3><div><span>剩余还款期数</span><b>${r.payoff} 期（${Math.floor(r.payoff/12)} 年 ${r.payoff%12} 个月）</b></div><div><span>预计结清时间</span><b>${last?dateFmt(last.date):'—'}</b></div><div><span>预计剩余利息</span><b>${yuan(r.totalInterest)}</b></div><div><span>月供</span><b>${yuan(l.payment??(l.mode==='annuity'?paymentFor(l.principal,l.annual/12,l.months):l.principal/l.months+l.principal*l.annual/12))}</b></div></div>`}).join('')}
function renderTabs(ids){document.querySelector('#balanceLegend').innerHTML=activeIds().map(id=>`<span><i class="dot" style="background:${id==='fund'?'#187a58':'#db7954'}"></i>${id==='fund'?'公积金':'商贷'}余额</span>`).join('')+'<span>虚线：累计利息</span>';document.querySelector('#balanceTabs').innerHTML=(ids.length>1?'<button data-kind="both">两笔贷款</button>':'')+ids.map(id=>`<button data-kind="${id}">${id==='fund'?'公积金':'商贷'}</button>`).join('');document.querySelector(`#balanceTabs [data-kind="${balanceKind}"]`)?.classList.add('active');document.querySelector('#shareTabs').innerHTML=(ids.length>1?'<button data-kind="both">两笔贷款</button>':'')+ids.map(id=>`<button data-kind="${id}">${id==='fund'?'公积金':'商贷'}</button>`).join('');document.querySelector(`#shareTabs [data-kind="${shareKind}"]`)?.classList.add('active');document.querySelector('#tableTabs').innerHTML=ids.map(id=>`<button data-kind="${id}">${id==='fund'?'公积金':'商贷'}</button>`).join('');document.querySelector(`#tableTabs [data-kind="${tableKind}"]`)?.classList.add('active')}
function calcBaseInterest(){return activeIds().reduce((s,id)=>s+calc({...state.loans.find(l=>l.id===id)},[]).totalInterest,0)}
function compare(){let ids=activeIds();if(ids.length<2){document.querySelector('#comparison').innerHTML='';return}let budget=state.budget,adjust=document.querySelector('#compareAdjust')?.value||'shorten',choices=ids.map(id=>{let l=state.loans.find(x=>x.id===id),extra=[{loan:id,period:1,amount:budget,adjust}],res=calc({...l,payment:l.payment??(l.mode==='annuity'?paymentFor(l.principal,l.annual/12,l.months):l.principal/l.months+l.principal*l.annual/12)},extra),other=calc(state.loans.find(x=>x.id!==id),[]);return{id,res,totalInterest:res.totalInterest+other.totalInterest,paidMonths:Math.max(res.payoff,other.payoff)}});let b=choices[0].totalInterest<=choices[1].totalInterest?choices[0]:choices[1];document.querySelector('#comparison').innerHTML=choices.map(c=>`<div class="comparebox"><h3>${c.id==='commercial'?'优先还商贷':'优先还公积金'} ${c===b?'<span class="winner">· 利息更低</span>':''}</h3><p>一次性提前还款 ${yuan(budget)} 后</p><p>预计两笔贷款总利息：<b>${yuan(c.totalInterest)}</b></p><p>全部结清约：${c.paidMonths} 期</p><p>该笔贷款预计结清：${c.res.payoff} 期</p></div>`).join('')+`<div class="field"><label>用于比较的一次性提前还款预算（元）</label><input id="budget" type="number" min="0" step="10000" value="${budget}"></div><div class="field"><label>比较时的还款后调整</label><select id="compareAdjust"><option value="shorten" ${adjust==='shorten'?'selected':''}>月供不变，缩短期限</option><option value="lowerPayment" ${adjust==='lowerPayment'?'selected':''}>期限不变，降低月供</option></select></div>`;document.querySelector('#budget').oninput=e=>{state.budget=Number(e.target.value);compare()};document.querySelector('#compareAdjust').onchange=()=>compare()}
function renderTable(){if(!results[tableKind]){document.querySelector('#scheduleTable').innerHTML='';return}let s=results[tableKind].schedule;let rows=s.slice(0,240).map(x=>`<tr data-period="${x.period}"><td>${x.period} · ${dateFmt(x.date)}</td><td>${yuan(x.payment)}</td><td>${yuan(x.interest)}</td><td>${yuan(x.principal)}</td><td>${pct(x.share)}</td><td>${x.extra?yuan(x.extra):'—'}</td><td>${yuan(x.balance)}</td></tr>`).join('');document.querySelector('#scheduleTable').innerHTML=`<div class="tablewrap"><table><thead><tr><th>期次 / 日期</th><th>月供</th><th>利息</th><th>归还本金</th><th>利息占比</th><th>提前还款</th><th>期末余额</th></tr></thead><tbody>${rows}</tbody></table></div>${s.length>240?`<div class="tfoot">当前显示前 240 期，共 ${s.length} 期。导出 CSV 可查看完整明细。</div>`:''}`}
document.querySelector('#addEarly').onclick=()=>{state.early.push({loan:'commercial',period:1,amount:50000,adjust:'shorten'});renderEarly();update()};document.querySelector('#reset').onclick=()=>{state=structuredClone(defaults);active={commercial:true,fund:true};balanceKind='both';renderInputs();update()};document.querySelector('#balanceTabs').onclick=e=>{let b=e.target.closest('button');if(!b)return;balanceKind=b.dataset.kind;document.querySelectorAll('#balanceTabs button').forEach(x=>x.classList.toggle('active',x===b));chartBalance()};document.querySelector('#shareTabs').onclick=e=>{let b=e.target.closest('button');if(!b)return;shareKind=b.dataset.kind;document.querySelectorAll('#shareTabs button').forEach(x=>x.classList.toggle('active',x===b));chartInterest()};document.querySelector('#tableTabs').onclick=e=>{let b=e.target.closest('button');if(!b)return;tableKind=b.dataset.kind;document.querySelectorAll('#tableTabs button').forEach(x=>x.classList.toggle('active',x===b));renderTable()};document.querySelector('#export').onclick=()=>{let rows=[['贷款','期次','日期','月供','利息','归还本金','利息占比','提前还款','期末余额']];state.loans.filter(l=>results[l.id]).forEach(l=>results[l.id].schedule.forEach(x=>rows.push([l.name,x.period,dateFmt(x.date),x.payment.toFixed(2),x.interest.toFixed(2),x.principal.toFixed(2),(100*x.share).toFixed(2)+'%',x.extra.toFixed(2),x.balance.toFixed(2)])));let csv='\ufeff'+rows.map(r=>r.join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='房贷还款计划.csv';a.click();URL.revokeObjectURL(a.href)};
